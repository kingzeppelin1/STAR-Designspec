<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Family</title>
<link rel="stylesheet" href="_card.css">
<style>
  .wrap { display: grid; grid-template-columns: 220px 1fr; gap: 22px; align-items: stretch; }
  .Aa { font-family: var(--font-display); font-weight: 300; font-size: 168px; line-height: 0.92; letter-spacing: -0.03em; color: var(--marine-700); }
  .right { display: flex; flex-direction: column; gap: 10px; }
  .role { font-size: 10px; letter-spacing: 0.10em; text-transform: uppercase; font-weight: 600; color: var(--marine-700); }
  .fam { font-family: var(--font-display); font-size: 28px; font-weight: 600; margin: 0; color: var(--color-fg); line-height: 1.1; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-muted); margin: 0; }
  .weights { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; margin-top: 4px; font-family: var(--font-display); }
  .weights span { padding: 4px 8px; border: 1px solid var(--color-border); border-radius: 4px; color: var(--color-fg); }
  .note { font-family: var(--font-display); font-size: 12px; color: var(--color-fg-muted); margin: 4px 0 0; max-width: 420px; line-height: 1.5; }
</style>
</head><body>
<div class="card">
  <div class="wrap">
    <div class="Aa">Aa</div>
    <div class="right">
      <div class="role">Single brand family</div>
      <h3 class="fam">Titillium Web</h3>
      <p class="meta">Wordmark · display · UI · body · caption</p>
      <div class="weights">
        <span style="font-weight:200">ExtraLight 200</span>
        <span style="font-weight:300">Light 300</span>
        <span style="font-weight:400">Regular 400</span>
        <span style="font-weight:600">SemiBold 600</span>
        <span style="font-weight:700">Bold 700</span>
      </div>
      <p class="note">All five weights ship in upright + italic. Self-hosted from <code>/fonts</code>. Both <code>--font-ui</code> and <code>--font-display</code> resolve to Titillium — never introduce another family.</p>
    </div>
  </div>
</div>
</body></html>
