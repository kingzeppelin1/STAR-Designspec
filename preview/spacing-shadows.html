<!doctype html>
<html><head><meta charset="utf-8"><title>Shadows / Elevation</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 12px 0; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .box {
    width: 130px; height: 80px;
    background: var(--paper);
    border-radius: 12px;
    border: 1px solid var(--color-border);
  }
  .s1 { box-shadow: var(--shadow-1); }
  .s2 { box-shadow: var(--shadow-2); border-color: transparent; }
  .s3 { box-shadow: var(--shadow-3); border-color: transparent; }
  .focus { box-shadow: var(--shadow-focus); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-muted); }
  .name b { color: var(--color-fg); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="grid">
    <div class="item"><div class="box"></div><span class="name"><b>none</b> · default</span></div>
    <div class="item"><div class="box s1"></div><span class="name"><b>shadow-1</b> · cards</span></div>
    <div class="item"><div class="box s2"></div><span class="name"><b>shadow-2</b> · popovers</span></div>
    <div class="item"><div class="box s3"></div><span class="name"><b>shadow-3</b> · modals</span></div>
  </div>
  <div class="grid" style="grid-template-columns: 1fr; padding-top: 0">
    <div class="item"><div class="box focus" style="width:200px"></div><span class="name"><b>shadow-focus</b> · keyboard focus ring</span></div>
  </div>
</div>
</body></html>
