<!doctype html>
<html><head><meta charset="utf-8"><title>Radii</title>
<link rel="stylesheet" href="_card.css">
<style>
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 88px; height: 60px; background: var(--marine-50); border: 1px solid var(--marine-200); }
  .name { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-muted); }
  .name b { color: var(--color-fg); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="grid">
    <div class="item"><div class="box" style="border-radius:2px"></div><span class="name"><b>xs</b> · 2</span></div>
    <div class="item"><div class="box" style="border-radius:4px"></div><span class="name"><b>sm</b> · 4</span></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><span class="name"><b>md</b> · 8</span></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><span class="name"><b>lg</b> · 12</span></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><span class="name"><b>xl</b> · 16</span></div>
    <div class="item"><div class="box" style="border-radius:999px"></div><span class="name"><b>pill</b> · ∞</span></div>
  </div>
</div>
</body></html>
