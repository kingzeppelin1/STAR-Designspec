<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Secondary (Commitment Pink)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .chip { border-radius: 6px; height: 56px; display:flex; flex-direction: column; justify-content: space-between; padding: 5px 7px; }
  .chip .step { font-family: var(--font-mono); font-size: 10px; opacity: .85; }
  .chip .hex  { font-family: var(--font-mono); font-size: 9px; opacity: .7; }
  .chip.dark { color: var(--paper); }
  .name { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .name h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; color: var(--marine-700); }
  .name .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-muted); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .role-row { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; }
  .role-row .lbl { font-size: 12px; }
  .role-row .lbl strong { font-family: var(--font-display); font-size: 14px; display: block; }
  .role-row .lbl em { font-style: normal; color: var(--color-fg-muted); font-size: 11px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--marine-600); }
</style>
</head><body><div class="card"><div class="name"><h3>Commitment Pink</h3><span class="meta">Secondary · "Relational" role · Main on light = 600</span></div><div class="scale"><div class="chip" style="background:var(--pink-50)"><span class="step">50</span><span class="hex">FCF0EF</span></div><div class="chip" style="background:var(--pink-100)"><span class="step">100</span><span class="hex">F4D1CC</span></div><div class="chip" style="background:var(--pink-200)"><span class="step">200</span><span class="hex">EFBBB4</span></div><div class="chip dark" style="background:var(--pink-300)"><span class="step">300</span><span class="hex">E89D92</span></div><div class="chip dark" style="background:var(--pink-400)"><span class="step">400</span><span class="hex">E3897D</span></div><div class="chip dark" style="background:var(--pink-500)"><span class="step">500</span><span class="hex">DC6C5C</span></div><div class="chip dark" style="background:var(--pink-600)"><span class="step">600</span><span class="hex">C86254</span></div><div class="chip dark" style="background:var(--pink-700)"><span class="step">700</span><span class="hex">9C4D41</span></div><div class="chip dark" style="background:var(--pink-800)"><span class="step">800</span><span class="hex">793B33</span></div><div class="chip dark" style="background:var(--pink-900)"><span class="step">900</span><span class="hex">5C2D27</span></div></div></div></body></html>
