<!doctype html>
<html><head><meta charset="utf-8"><title>Brand — Logo</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stage {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  .swatch {
    border: 1px solid var(--color-border);
    border-radius: 12px;
    height: 140px;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .light { background: var(--bg); }
  .dark  { background: var(--marine-700); }
  .swatch img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .meta { display: flex; justify-content: space-between; margin-top: 10px; }
</style>
</head><body>
<div class="card">
  <div class="stage">
    <div class="swatch light"><img src="../assets/logo-horizontal-blue.png" alt="STAR horizontal blue"></div>
    <div class="swatch dark"><img src="../assets/logo-horizontal-white.png" alt="STAR horizontal white"></div>
    <div class="swatch light"><img src="../assets/logo-brandmark-blue.png" alt="STAR brandmark blue" style="max-height:100px"></div>
    <div class="swatch dark"><img src="../assets/logo-brandmark-white.png" alt="STAR brandmark white" style="max-height:100px"></div>
  </div>
  <div class="meta"><span class="tag">horizontal · brandmark</span><span class="tag">blue (#123959) · white</span></div>
</div>
</body></html>
