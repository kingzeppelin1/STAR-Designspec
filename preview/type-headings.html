<!doctype html>
<html><head><meta charset="utf-8"><title>Type — Display & Headings</title>
<link rel="stylesheet" href="_card.css">
<style>
  ul.scale { list-style: none; padding: 0; margin: 0; font-family: var(--font-display); }
  ul.scale li { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--color-divider); }
  ul.scale li:last-child { border-bottom: 0; }
  .specimen { color: var(--color-fg); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-muted); white-space: nowrap; }
</style>
</head><body>
<div class="card">
  <ul class="scale">
    <li><span class="specimen" style="font-weight:300; font-size:47px; line-height:1.2; letter-spacing:-0.01em">Display XL — Section titles</span><span class="meta">Light 300 · 47 / 1.2</span></li>
    <li><span class="specimen" style="font-weight:400; font-size:33px; line-height:1.25; letter-spacing:-0.005em">Display L — Hero copy</span><span class="meta">Regular 400 · 33 / 1.25</span></li>
    <li><span class="specimen" style="font-weight:600; font-size:28px; line-height:1.25">H1 — Page heading</span><span class="meta">SemiBold 600 · 28 / 1.25</span></li>
    <li><span class="specimen" style="font-weight:600; font-size:24px; line-height:1.3">H2 — Subsection</span><span class="meta">SemiBold 600 · 24 / 40px</span></li>
    <li><span class="specimen" style="font-weight:600; font-size:21px; line-height:1.3">H3 — Group label</span><span class="meta">SemiBold 600 · 21 / 1.3</span></li>
    <li><span class="specimen" style="font-weight:600; font-size:18px; line-height:1.3">H4 — Card title</span><span class="meta">SemiBold 600 · 18 / 1.3</span></li>
  </ul>
</div>
</body></html>
