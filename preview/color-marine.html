<!doctype html>
<html><head><meta charset="utf-8"><title>Colors — Primary (Genuine Marine)</title>
<link rel="stylesheet" href="_card.css">
<style>
  .scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .chip { border-radius: 6px; height: 56px; display:flex; flex-direction: column; justify-content: space-between; padding: 5px 7px; }
  .chip .step { font-family: var(--font-mono); font-size: 10px; opacity: .85; }
  .chip .hex  { font-family: var(--font-mono); font-size: 9px; opacity: .7; }
  .chip.dark { color: var(--paper); }
  .name { display: flex; align-items: baseline; gap: 12px; margin-bottom: 10px; }
  .name h3 { font-family: var(--font-display); font-size: 18px; font-weight: 600; margin: 0; color: var(--marine-700); }
  .name .meta { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-muted); }
  .stack { display: flex; flex-direction: column; gap: 14px; }
  .role-row { display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: center; }
  .role-row .lbl { font-size: 12px; }
  .role-row .lbl strong { font-family: var(--font-display); font-size: 14px; display: block; }
  .role-row .lbl em { font-style: normal; color: var(--color-fg-muted); font-size: 11px; }
  .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background: var(--marine-600); }
</style>
</head><body><div class="card"><div class="name"><h3>Genuine Marine</h3><span class="meta">Primary · Main on light = <span class="dot"></span> 600 · Main on dark = 300</span></div><div class="scale"><div class="chip" style="background:var(--marine-50)"><span class="step">50</span><span class="hex">E7EBEE</span></div><div class="chip" style="background:var(--marine-100)"><span class="step">100</span><span class="hex">B6C2CC</span></div><div class="chip" style="background:var(--marine-200)"><span class="step">200</span><span class="hex">92A4B3</span></div><div class="chip dark" style="background:var(--marine-300)"><span class="step">300</span><span class="hex">607A90</span></div><div class="chip dark" style="background:var(--marine-400)"><span class="step">400</span><span class="hex">41617A</span></div><div class="chip dark" style="background:var(--marine-500)"><span class="step">500</span><span class="hex">123959</span></div><div class="chip dark" style="background:var(--marine-600)"><span class="step">600</span><span class="hex">103451</span></div><div class="chip dark" style="background:var(--marine-700)"><span class="step">700</span><span class="hex">0D283F</span></div><div class="chip dark" style="background:var(--marine-800)"><span class="step">800</span><span class="hex">0A1F31</span></div><div class="chip dark" style="background:var(--marine-900)"><span class="step">900</span><span class="hex">081825</span></div></div></div></body></html>
