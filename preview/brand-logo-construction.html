<!doctype html>
<html><head><meta charset="utf-8"><title>Brand — Logo construction</title>
<link rel="stylesheet" href="_card.css">
<style>
  .stage { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; }
  .clear {
    position: relative;
    background: var(--bg);
    border: 1px dashed var(--neutral-300);
    border-radius: 12px;
    height: 220px;
    display: flex; align-items: center; justify-content: center;
  }
  .clear img { height: 120px; }
  .guide {
    position: absolute; inset: 24px;
    border: 1px dashed var(--marine-200);
    border-radius: 8px;
    pointer-events: none;
  }
  .rules { display: flex; flex-direction: column; gap: 14px; font-size: 13px; line-height: 1.55; }
  .rules .label { margin-bottom: 2px; }
  .rules p { margin: 0; color: var(--color-fg); }
  .min { display: flex; gap: 18px; align-items: flex-end; }
  .min figure { margin: 0; text-align: center; }
  .min img { display: block; }
  .min figcaption { font-family: var(--font-mono); font-size: 11px; color: var(--color-fg-muted); margin-top: 6px; }
</style>
</head><body>
<div class="card">
  <div class="stage">
    <div class="clear">
      <span class="guide"></span>
      <img src="../assets/logo-horizontal-blue.png" alt="STAR">
    </div>
    <div class="rules">
      <div>
        <div class="label">Clear space</div>
        <p>Maintain a margin equal to the height of the brandmark on all sides.</p>
      </div>
      <div>
        <div class="label">Minimum size</div>
        <div class="min">
          <figure><img src="../assets/logo-brandmark-blue.png" style="height:32px"><figcaption>32px</figcaption></figure>
          <figure><img src="../assets/logo-horizontal-blue.png" style="height:24px"><figcaption>24px</figcaption></figure>
        </div>
      </div>
    </div>
  </div>
</div>
</body></html>
