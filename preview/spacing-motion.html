<!doctype html>
<html><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="_card.css">
<style>
  body { background: var(--bg); }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .row {
    display: grid; grid-template-columns: 110px 1fr; align-items: center;
    padding: 12px 14px; background: var(--paper); border: 1px solid var(--color-border); border-radius: 10px;
  }
  .name { font-family: var(--font-mono); font-size: 12px; color: var(--color-fg); }
  .desc { font-size: 12px; color: var(--color-fg-muted); }
  .desc b { color: var(--color-fg); font-weight: 600; }
</style>
</head><body>
<div class="card">
  <div class="grid">
    <div class="row"><span class="name">120ms</span><span class="desc"><b>Fast</b> — hover, micro-feedback</span></div>
    <div class="row"><span class="name">200ms</span><span class="desc"><b>Base</b> — default UI transitions</span></div>
    <div class="row"><span class="name">320ms</span><span class="desc"><b>Slow</b> — sheet / modal entrance</span></div>
    <div class="row"><span class="name">cubic-bezier(.2,0,.2,1)</span><span class="desc"><b>Standard</b> easing</span></div>
    <div class="row"><span class="name">cubic-bezier(.2,0,0,1)</span><span class="desc"><b>Emphasize</b> — entrances</span></div>
    <div class="row"><span class="name">no bounce</span><span class="desc">Fades & small translations only</span></div>
  </div>
</div>
</body></html>
